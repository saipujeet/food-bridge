spring.application.name=foodbridge-backend
server.port=8080

# Database Configuration (H2 In-Memory with MySQL compatibility)
spring.datasource.url=jdbc:h2:mem:foodbridgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
foodbridge.jwt.secret=9a4f2c8d7e1b5a3f6e8d2c4b7a9f1e3d5c7b9a2f4e6d8c1b3a5f7e9d2c4b6a8f
foodbridge.jwt.expiration-ms=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000
